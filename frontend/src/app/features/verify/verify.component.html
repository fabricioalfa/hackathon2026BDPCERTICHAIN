<div class="verify-wrapper">
  <p-card header="Verificación de certificado" subheader="Consulta pública · CERTICHAIN BDP">
    <div class="field">
      <label for="uuid">UUID del certificado</label>
      <input pInputText id="uuid" [(ngModel)]="uuid" placeholder="CC-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
    </div>
    <div class="field">
      <label for="hash">Hash del documento (SHA-256)</label>
      <input pInputText id="hash" [(ngModel)]="hash" placeholder="hash de 64 caracteres hex" />
    </div>
    <p-button label="Verificar autenticidad" icon="pi pi-shield" [loading]="checking" styleClass="w-full" (onClick)="verify()" />
  </p-card>

  <p-card *ngIf="cert" [style]="{ 'margin-top': '1.5rem' }">
    <div class="valid-banner">
      <i class="pi pi-check-circle" style="font-size: 2rem"></i>
      <h3 style="margin: 0.5rem 0 0">Documento auténtico y verificado</h3>
    </div>
    <div class="detail">
      <div class="row"><span>UUID:</span><code>{{ cert.uuid }}</code></div>
      <div class="row"><span>Hash:</span><code>{{ cert.documentHash }}</code></div>
      <div class="row"><span>Transacción:</span><code>{{ cert.txId }}</code></div>
      <div class="row"><span>Título:</span><b>{{ cert.title }}</b></div>
      <div class="row"><span>Tipo:</span>{{ cert.docType }}</div>
      <div class="row"><span>Titular:</span>{{ cert.holderName }}</div>
      <div class="row"><span>Emisión:</span>{{ cert.issueDate | date: 'dd/MM/yyyy HH:mm' }}</div>
      <div class="row"><span>Estado:</span><p-tag [value]="cert.status" [severity]="statusSeverity(cert.status)" /></div>
    </div>
  </p-card>
</div>
