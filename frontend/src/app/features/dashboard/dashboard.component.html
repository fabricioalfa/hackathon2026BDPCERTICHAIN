<p-toolbar>
  <ng-template #start>
    <h2 style="margin: 0">CERTICHAIN BDP · Dashboard</h2>
  </ng-template>
  <ng-template #end>
    <p-button label="Actualizar" icon="pi pi-refresh" styleClass="p-button-text mr-2" [loading]="loading" (onClick)="load()" />
    <p-button label="Emitir certificado" icon="pi pi-plus" styleClass="p-button-primary mr-2" (onClick)="goTo('/issue')" />
    <p-button label="Salir" icon="pi pi-sign-out" styleClass="p-button-text" (onClick)="logout()" />
  </ng-template>
</p-toolbar>

<div class="grid">
  <p-card header="Certificados emitidos">
    <div class="loading-center" *ngIf="loading">
      <p-progressspinner styleClass="w-3rem h-3rem" strokeWidth="3" />
      <p style="margin-top:0.5rem">Cargando certificados…</p>
    </div>
    <div class="error-alert" *ngIf="error && !loading">
      <i class="pi pi-exclamation-triangle" style="margin-right:0.4rem"></i>
      {{ error }}
      <p-button label="Reintentar" icon="pi pi-refresh" styleClass="p-button-sm p-button-outlined ml-2" (onClick)="load()" />
    </div>
    <p-table [value]="certificates" [paginator]="true" [rows]="8" styleClass="p-datatable-sm" *ngIf="!loading && !error">
      <ng-template #header>
        <tr>
          <th>UUID</th>
          <th>Título</th>
          <th>Tipo</th>
          <th>Titular</th>
          <th>CI / DNI</th>
          <th>Estado</th>
          <th>Emisión</th>
        </tr>
      </ng-template>
      <ng-template #body let-c>
        <tr>
          <td><code>{{ c.uuid }}</code></td>
          <td>{{ c.title }}</td>
          <td>{{ c.docType }}</td>
          <td>{{ c.holderName }}</td>
          <td>{{ c.holderDni }}</td>
          <td><p-tag [value]="c.status" [severity]="statusSeverity(c.status)" /></td>
          <td>{{ c.issueDate | date: 'dd/MM/yyyy HH:mm' }}</td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="7" style="text-align:center">No hay certificados emitidos</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
