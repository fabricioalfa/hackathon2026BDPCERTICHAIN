<div class="login-wrapper">
  <p-card header="CERTICHAIN BDP" subheader="Plataforma de Certificación y Trazabilidad Digital">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="username">Usuario</label>
        <input pInputText id="username" formControlName="username" placeholder="admin" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <p-password id="password" formControlName="password" [feedback]="false" placeholder="••••••••" />
      </div>
      <p-button type="submit" label="Ingresar" [loading]="loading" styleClass="w-full" />
    </form>
    <div class="hint">Usuarios demo: <code>admin/admin123</code> · <code>operador/operador123</code></div>
  </p-card>
</div>
