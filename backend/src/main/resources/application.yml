spring:
  application:
    name: certichain-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/certichain}
    username: ${DB_USERNAME:certichain}
    password: ${DB_PASSWORD:certichain_dev_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

# Documentacion API (Swagger / OpenAPI 3)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Seguridad JWT
app:
  jwt:
    secret: ${JWT_SECRET:certichain-bdp-secret-key-debe-cambiarse-en-produccion-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Storage local de documentos custodiados
  documents-dir: ${DOCUMENTS_DIR:/app/documents}

# Servicios externos
frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

ocr:
  url: ${OCR_URL:http://localhost:8090/api/ocr}

fabric:
  channel: ${FABRIC_CHANNEL:certchain}
  chaincode: ${FABRIC_CHAINCODE:certchain}
  peer-endpoint: ${FABRIC_PEER_ENDPOINT:localhost:7051}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
