# ============================================================
# CERTICHAIN BDP - Nginx reverse proxy (desarrollo opcional)
#
# Enruta:
#   /            -> frontend Angular (puerto 4200)
#   /api/        -> backend Spring Boot (puerto 8080)
#   /ocr/        -> microservicio OCR (puerto 8090)
#
# Uso (opcional, solo si quieres un unico punto de entrada):
#   docker run -d --rm --name certchain-proxy \
#     -p 80:80 \
#     -v $PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
#     --network certichain_default \
#     nginx:1.27-alpine
# ============================================================
upstream frontend_upstream { server host.docker.internal:4200; }
upstream backend_upstream { server host.docker.internal:8080; }
upstream ocr_upstream { server host.docker.internal:8090; }

server {
    listen 80;
    server_name _;

    # Frontend Angular
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Swagger
    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OCR
    location /ocr/ {
        proxy_pass http://ocr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
}
