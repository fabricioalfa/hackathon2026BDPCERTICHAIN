# ============================================================
# CERTICHAIN BDP - Manifiestos Kubernetes base
#
# NOTA: En el hackathon/demo local NO se requiere este cluster.
# La plataforma corre con Docker Compose (make up). Estos YAML
# estan listos para escalar la solucion a Kubernetes en produccion
# (Fase IV de la propuesta).
#
# Orden de aplicacion:
#   kubectl apply -f infra/k8s/namespace.yaml
#   kubectl apply -f infra/k8s/configmap.yaml
#   kubectl apply -f infra/k8s/secret.yaml       (editar antes)
#   kubectl apply -f infra/k8s/                  (resto)
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: certichain
  labels:
    app: certichain
