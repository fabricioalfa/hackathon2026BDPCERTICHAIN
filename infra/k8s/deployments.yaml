# ============================================================
# CERTICHAIN BDP - Kubernetes manifests (base)
#
# Orden: kubectl apply -f infra/k8s/
#
# Convierte cada servicio de docker-compose a Deployment+Service:
#   - backend       -> app/certichain-backend
#   - frontend      -> app/certichain-frontend
#   - ocr           -> app/certichain-ocr
#   - postgres      -> app/certichain-postgres (con PVC)
# ============================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: certichain
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, valueFrom: { configMapKeyRef: { name: certichain-config, key: DB_NAME } } }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: certichain-secrets, key: DB_USERNAME } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: certichain-secrets, key: DB_PASSWORD } } }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: init-sql, mountPath: /docker-entrypoint-initdb.d }
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: certichain
spec:
  selector: { app: postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: certichain
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 5Gi }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: certichain
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: certichain/backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: certichain-config }
            - secretRef: { name: certichain-secrets }
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/$(DB_NAME)"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { memory: "512Mi", cpu: "200m" }
            limits: { memory: "1Gi", cpu: "1000m" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: certichain
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: certichain
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: certichain/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "250m" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: certichain
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80 }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr
  namespace: certichain
spec:
  replicas: 1
  selector:
    matchLabels: { app: ocr }
  template:
    metadata:
      labels: { app: ocr }
    spec:
      containers:
        - name: ocr
          image: certichain/ocr:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8090 }]
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: ocr
  namespace: certichain
spec:
  selector: { app: ocr }
  ports:
    - { name: http, port: 8090, targetPort: 8090 }
